name: Build Windows exe

on:
  push:
    branches: [v3-beta]
    paths: [".github/workflows/build-exe.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build spicetify.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -ldflags "-s -w" -o spicetify.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spicetify-windows-x64
          path: spicetify.exe
